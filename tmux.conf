#Set default shell
set-option -g default-shell /bin/bash

#Allows mouse
set -g mouse on

#Fix duplicate PATH
set -g default-command "$SHELL"

#Theme support
# set -g default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

#Use | and - to split screen
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

#Switch panes using Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Alt + H/L
bind -n M-h previous-window
bind -n M-l next-window

#Keybinding
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Styling

# Transparent/Terminal matching status bar background
set -g status-style bg=default,fg=white
set -g status-justify left
set -g status-interval 2     # Update stats every 2 seconds

# Left status block: Green/Pink accents similar to your prompt
set -g status-left "#[fg=green,bold][#S] #[fg=white,nobold]"
set -g status-left-length 20

# Active and inactive window tabs
setw -g window-status-current-style fg=red,bold
setw -g window-status-current-format " #I:#W* "
setw -g window-status-style fg=brightblack
setw -g window-status-format " #I:#W "

# Right status block: Clean pink/red timestamp matching your date block
set -g status-right-length 80
set -g status-right "#[fg=green] #(uptime | awk -F'load average:' '{print $2}' | cut -d, -f1 | xargs) #[fg=brightblack] | #[fg=cyan] #(free -h | awk '/Mem:/ {print $3 \"/\" $2}') #[fg=brightblack] | #[fg=61AFEF,bold] %H:%M #[fg=brightblack] | #[fg=red,bold] %d %b"
