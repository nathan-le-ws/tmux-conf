### General settings

# Set default shell
set-option -g default-shell /bin/bash

# Allows mouse
set -g mouse on

# Fix duplicate PATH
set -g default-command "$SHELL"

# Set environment variables
# set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID WINDOWID XAUTHORITY DBUS_SESSION_BUS_ADDRESS"

### Theme support
# set -g default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"


### Keybinding
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Use | and - to split screen
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes using Alt + arrows
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows using Alt + H/L
bind -n M-h previous-window
bind -n M-l next-window

# Source file 
bind r source-file ~/.config/tmux/tmux.conf

### List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

### Plugins

# Theme 
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark256' # or 'dark256', 'light', 'light256'

# Resurrent
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Continuum
set -g @plugin 'tmux-plugins/tmux-continuum'

# FZF
set -g @plugin 'sainnhe/tmux-fzf'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run 'tpack init'
run '~/.tmux/plugins/tpm/tpm'
